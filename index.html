<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cozy Art Prompt Generator</title>
<style>
    body {
        font-family: 'Pixel Operator', monospace;
        background: linear-gradient(to bottom right, #cce7ff, #ffd6e8, #ffffff);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .generator-container {
        display: flex;
        gap: 30px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        z-index: 1;
    }

    .module {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.7);
        padding: 15px;
        border-radius: 10px;
        min-width: 150px;
    }

    .module h3 {
        margin: 5px 0;
        font-size: 16px;
        color: #555;
    }

    .module p {
        min-height: 40px;
        text-align: center;
        font-size: 14px;
        margin: 5px 0 10px 0;
        color: #333;
    }

    .module button {
        background-color: #ffd6e8;
        border: 2px solid #cce7ff;
        border-radius: 5px;
        padding: 5px 10px;
        font-family: 'Pixel Operator', monospace;
        cursor: pointer;
        transition: 0.2s;
    }

    .module button:hover {
        background-color: #cce7ff;
    }

    .color-box {
        width: 50px;
        height: 50px;
        border-radius: 5px;
        margin: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: white;
        font-weight: bold;
    }

    /* Animated cat */
    #pixel-cat {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: auto;
        image-rendering: pixelated;
        z-index: 0;
        animation: tailWag 1.2s infinite alternate ease-in-out;
        transform-origin: bottom center;
    }

    @keyframes tailWag {
        0% { transform: translateX(-50%) rotate(0deg); }
        25% { transform: translateX(-50%) rotate(5deg); }
        50% { transform: translateX(-50%) rotate(0deg); }
        75% { transform: translateX(-50%) rotate(-5deg); }
        100% { transform: translateX(-50%) rotate(0deg); }
    }
</style>
</head>
<body>
    <div class="generator-container">
        <div class="module">
            <h3>Subject</h3>
            <p id="subject">...</p>
            <button onclick="generateSubject()">Spin</button>
        </div>
        <div class="module">
            <h3>Style</h3>
            <p id="style">...</p>
            <button onclick="generateStyle()">Spin</button>
        </div>
        <div class="module">
            <h3>Mood</h3>
            <p id="mood">...</p>
            <button onclick="generateMood()">Spin</button>
        </div>
        <div class="module">
            <h3>Colour Palette</h3>
            <div id="palette" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>
            <button onclick="generatePalette()">Generate</button>
        </div>
    </div>

    <!-- Animated pixel cat -->
    <img src="A_pixel_art_digital_illustration_features_an_adora.png" alt="Cute Pixel Cat" id="pixel-cat">

    <script>
        const subjects = [
            "a girl posing for a photo", "a castle", "dancing woman", 
            "a guy listening to music in a crowdy train", "blythe dolls", "a goddess", 
            "sleeping cat", "ethereal angel", "Dreamy landscape", 
            "Cute monster", "bleeding knight", "lovers", "witch", "a ball party", "zombies", "city build on clouds", 
            "mermaid", "a planet as a person", "video game character", "starry desert", "time standing still"
        ];

        const styles = [
            "Watercolor", "Oil painting", "Digital art", "realism", 
            "Pixel art", "Pastel drawing", "Collage", "Anime style", 
            "Cartoonish", "pencil colours"
        ];

        const moods = [
            "Dreamy", "Dark and eerie", "Whimsical", "Melancholic", 
            "Cozy", "Mysterious", "Cheerful", "Calm", "Playful", "Nostalgic", "liminal", "spooky"
        ];

        function randomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateSubject() {
            document.getElementById("subject").innerText = randomItem(subjects);
        }

        function generateStyle() {
            document.getElementById("style").innerText = randomItem(styles);
        }

        function generateMood() {
            document.getElementById("mood").innerText = randomItem(moods);
        }

        function generatePalette() {
            const paletteDiv = document.getElementById("palette");
            paletteDiv.innerHTML = "";
            for (let i = 0; i < 5; i++) {
                const color = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
                const colorBox = document.createElement("div");
                colorBox.className = "color-box";
                colorBox.style.backgroundColor = color;
                colorBox.innerText = color;
                paletteDiv.appendChild(colorBox);
            }
        }
    </script>
</body>
</html>

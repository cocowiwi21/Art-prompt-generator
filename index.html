<!DOCTYPE html>
<html>
<head> 
    <meta charset=UTF-8>
    <title>Ultimate Art Prompt Generator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #2b2d5a, #0f1023 70%);
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            width: 90%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 0 40px rgba(120, 115, 245, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ff6ec4, #7873f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #ff6ec4, #7873f5);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(120,115,245,0.5);
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255,110,196,0.6);
        }

        #result {
            margin-top: 35px;
            font-size: 20px;
            line-height: 1.6;
            min-height: 60px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .show {
            opacity: 1 !important;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(1); }
            to { opacity: 1; transform: scale(1.8); }
        }
    </style>
</head>

<body>
    <div>
  <h3>Subject</h3>
  <p id="subject"></p>
  <button onclick="generateSubject()">Spin</button>
</div>

<div>
  <h3>Style</h3>
  <p id="style"></p>
  <button onclick="generateStyle()">Spin</button>
</div>

<div>
  <h3>Mood</h3>
  <p id="mood"></p>
  <button onclick="generateMood()">Spin</button>
</div>

    <div class="container">
        <h1>✨ Ultimate Art Prompt Generator ✨</h1>
        <button onclick="generatePrompt()">Generate Magic</button>
        <div id="result"></div>
    </div>

    <script>
        const themes = [
            "Fantasy", "Sci-fi", "Cyberpunk", "Steampunk", "Mythology",
            "Horror", "Gothic", "Nature", "Post-apocalyptic", "Medieval",
            "Underwater", "Space", "Dreamscape", "Surreal", "Urban",
            "Cottagecore", "Desert world", "Ice kingdom", "Celestial", "Time travel"
        ];

        const subjects = [
            "girl", "warrior", "witch", "astronaut", "scientist",
            "dancer", "angel", "demon", "explorer", "dragon",
            "wolf", "cat", "whale", "unicorn", "giant insect",
            "mirror", "lantern", "ancient book", "enchanted sword",
            "mysterious mask", "crown", "key", "potion", "portal door",
            "lost city", "forest temple", "crystal castle", "floating island"
        ];

        function generatePrompt() {
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            const randomSubject = subjects[Math.floor(Math.random() * subjects.length)];

            const resultDiv = document.getElementById("result");
            resultDiv.innerText = "Draw a " + randomSubject + " in a " + randomTheme + " style.";
            resultDiv.classList.add("show");
        }

        // sparkle generator
        for (let i = 0; i < 40; i++) {
            const sparkle = document.createElement("div");
            sparkle.className = "sparkle";
            sparkle.style.top = Math.random() * 100 + "vh";
            sparkle.style.left = Math.random() * 100 + "vw";
            sparkle.style.animationDuration = (2 + Math.random() * 4) + "s";
            document.body.appendChild(sparkle);
        }
        const subjects = ["Lonely astronaut", "Floating city", "Ancient tree spirit", "Cyberpunk cat"];
const styles = ["Watercolor", "Oil painting", "Digital art", "Ink sketch"];
const moods = ["Dreamy", "Dark and eerie", "Whimsical", "Melancholic"];

function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generateSubject() {
    document.getElementById("subject").innerText = randomItem(subjects);
}

function generateStyle() {
    document.getElementById("style").innerText = randomItem(styles);
}

function generateMood() {
    document.getElementById("mood").innerText = randomItem(moods);
}
    </script>

</body>
</html>

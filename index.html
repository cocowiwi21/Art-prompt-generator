<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cozy Art Prompt Generator</title>
<style>
body {
    font-family: 'Pixel Operator', monospace;
    background: linear-gradient(to bottom right, #cce7ff, #ffd6e8, #ffffff);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

.generator-container {
    display: flex;
    gap: 30px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    z-index: 1;
}

.module {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.7);
    padding: 15px;
    border-radius: 10px;
    min-width: 150px;
}

.module h3 {
    margin: 5px 0;
    font-size: 16px;
    color: #555;
}

.module p {
    min-height: 40px;
    text-align: center;
    font-size: 14px;
    margin: 5px 0 10px 0;
    color: #333;
}

.module button {
    background-color: #ffd6e8;
    border: 2px solid #cce7ff;
    border-radius: 5px;
    padding: 5px 10px;
    font-family: 'Pixel Operator', monospace;
    cursor: pointer;
    transition: 0.2s;
}

.module button:hover {
    background-color: #cce7ff;
}

.color-box {
    width: 50px;
    height: 50px;
    border-radius: 5px;
    margin: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: white;
    font-weight: bold;
}

/* Animated cat at bottom center */
#pixel-cat {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: auto;
    image-rendering: pixelated;
    z-index: 0;
    animation: tailWag 1.2s infinite alternate ease-in-out;
    transform-origin: bottom center;
}

@keyframes tailWag {
    0% { transform: translateX(-50%) rotate(0deg); }
    25% { transform: translateX(-50%) rotate(5deg); }
    50% { transform: translateX(-50%) rotate(0deg); }
    75% { transform: translateX(-50%) rotate(-5deg); }
    100% { transform: translateX(-50%) rotate(0deg); }
}
</style>
</head>
<body>
<div class="generator-container">
    <div class="module">
        <h3>Subject</h3>
        <p id="subject">...</p>
        <button onclick="generateSubject()">Spin</button>
    </div>
    <div class="module">
        <h3>Style</h3>
        <p id="style">...</p>
        <button onclick="generateStyle()">Spin</button>
    </div>
    <div class="module">
        <h3>Mood</h3>
        <p id="mood">...</p>
        <button onclick="generateMood()">Spin</button>
    </div>
    <div class="module">
        <h3>Colour Palette</h3>
        <div id="palette" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>
        <button onclick="generatePalette()">Generate</button>
    </div>
</div>
